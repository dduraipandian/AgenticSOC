agent:
  max_iteration: 25
  trace: true
  trace_streaming: false
  max_tool_calls_per_turn: 5
  max_seconds: 300
  force_toolcall: True
providers:
  gemini:
    model: "models/gemini-3.5-flash-lite"
    reasoning: high
    timeout_ms: 60000      # per model call; the agent cannot interrupt a call that hangs
    retry_attempts: 3      # including the first try; 408, 429 and 5xx are retried
