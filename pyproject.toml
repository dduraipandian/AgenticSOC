[project]
name = "agentic_soc_analyst"
version = "0.1.0"
description = "SOC investigation lab: alert pipeline for learning AI agent backend engineering"
requires-python = ">=3.14"
dependencies = [
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic[email,timezone]>=2.7",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.3.9",
    "pyyaml>=6.0.3",
    "alembic>=1.20.1",
    "sqlalchemy>=2.1.8",
    "google-genai>=3.3.0",
    "beartype>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Docker Compose stack"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
ignore = ["C408"]
